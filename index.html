<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC39 — dekorator DEBUG</title>
  <style>
    :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
    body { max-width: 820px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.8rem; }
    button { padding: 12px 18px; cursor: pointer; font: inherit; }
    pre { padding: 20px; border: 1px solid #8886; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    [data-result="pass"] { color: #259c65; }
    [data-result="fail"] { color: #df5353; }
  </style>
  <script>
    // Uruchamiane przed modułem TS: pokaże także błąd helperów HMR Bun.
    let errorShown = false;
    function showRuntimeError(error) {
      const message = "BŁĄD RUNTIME: " + (error?.stack || error?.message || String(error));
      console.error(error);
      const status = document.querySelector("#status");
      const report = document.querySelector("#report");
      if (status) { status.textContent = "Błąd uruchomienia"; status.dataset.result = "fail"; }
      if (report) report.textContent = message;
      if (!errorShown) { errorShown = true; alert(message); }
    }
    window.addEventListener("error", event => showRuntimeError(event.error || event.message || "Nie udało się załadować skryptu"));
    window.addEventListener("unhandledrejection", event => showRuntimeError(event.reason));
  </script>
</head>
<body>
  <h1>Dekorator <code>@DEBUG</code> — TC39</h1>
  <p>Sprawdzenie argumentów <code>value</code> i <code>context</code> oraz zachowania dekorowanych elementów.</p>
  <p id="status">Oczekiwanie na wykonanie dekoratorów…</p>
  <button id="show-alert" type="button">Pokaż alert ponownie</button>
  <pre id="report">Raport pojawi się po uruchomieniu modułu TypeScript.</pre>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

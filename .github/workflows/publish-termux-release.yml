name: Publish Bun 1.4.4 Termux release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 41059523736 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "bun-1.4.4-termux-aarch64" \
            --dir dist
          test -f dist/build/release/bun
          test -f dist/bun-termux-aarch64.sha256

      - name: Verify binary and prepare release assets
        run: |
          set -euo pipefail
          actual_sha="$(sha256sum dist/build/release/bun | cut -d' ' -f1)"
          expected_sha="af859b178246aac981f2c4f7d0dcbc1d04598cc061586075e6c2d4935b593ec7"
          test "$actual_sha" = "$expected_sha"
          cp dist/build/release/bun dist/bun-1.4.4-termux-aarch64
          printf '%s  %s\n' "$actual_sha" "bun-1.4.4-termux-aarch64" > dist/bun-1.4.4-termux-aarch64.sha256
          {
            echo "### SHA-256"
            cat dist/bun-1.4.4-termux-aarch64.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.4.4-termux"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'NOTES'
          Prebuilt Bun 1.4.4 for Android ARM64 / Termux (Android API 28+).

          SHA-256:
          af859b178246aac981f2c4f7d0dcbc1d04598cc061586075e6c2d4935b593ec7

          Build workflow: https://github.com/TiedWithType/bun-tc39-decorators/actions/runs/41059523736

          The binary was compiled and its ELF format and checksum were verified. It has not been runtime-tested on a physical Android device.
          NOTES
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/bun-1.4.4-termux-aarch64 \
              dist/bun-1.4.4-termux-aarch64.sha256 \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Bun 1.4.4 — Termux ARM64" \
              --notes-file "$notes_file"
          else
            gh release create "$tag" \
              dist/bun-1.4.4-termux-aarch64 \
              dist/bun-1.4.4-termux-aarch64.sha256 \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Bun 1.4.4 — Termux ARM64" \
              --notes-file "$notes_file"
          fi

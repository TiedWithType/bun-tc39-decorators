name: Validate standalone Bun 1.4.4 TC39 HMR patch

on:
  push:
    branches: [main]
    paths:
      - "patches/bun-1.4.4-tc39-hmr.patch"
      - ".github/workflows/validate-bun-1.4.4-hmr.yml"
  pull_request:
    branches: [main]
    paths:
      - "patches/bun-1.4.4-tc39-hmr.patch"
      - ".github/workflows/validate-bun-1.4.4-hmr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Checkout pinned Bun 1.4.4 sources
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: 38afee6c84fcf48c0edb2466aa4b27d287a59c30
          path: bun-source
          fetch-depth: 1

      - name: Apply standalone patch and verify scope
        working-directory: bun-source
        run: |
          set -euo pipefail
          git apply --check ../patches-repo/patches/bun-1.4.4-tc39-hmr.patch
          git apply ../patches-repo/patches/bun-1.4.4-tc39-hmr.patch
          git diff --check
          git diff --name-only | sort > changed-files.txt
          cat changed-files.txt
          cat > expected-files.txt <<'EOF'
          src/runtime/bake/bake.private.d.ts
          src/runtime/bake/hmr-module.ts
          test/bake/dev/bundle.test.ts
          EOF
          diff -u expected-files.txt changed-files.txt

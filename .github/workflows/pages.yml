name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build static site
        run: bun build ./index.html --outdir ./dist --public-path /bun-tc39-decorators/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clear stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const staleRef = "0fc08ce0323f2231687df73386effba284b8c1e4";
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, ref: staleRef, environment: "github-pages", per_page: 100
            });

            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 10
              });
              const latest = statuses[0];

              if (latest?.state === "in_progress") {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id, state: "inactive",
                  description: "Closing stale GitHub Pages deployment before retry."
                });
                await github.rest.repos.deleteDeployment({
                  owner, repo, deployment_id: deployment.id
                });
                core.info(`Removed stale Pages deployment ${deployment.id}.`);
              }
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
